name: MealCare Macro APK
on:
  push:
    branches: [mealcare-macro-v1]
    paths: ['mealcare-macro/**', '.github/workflows/mealcare-macro-build.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: mealcare-macro
      - uses: actions/upload-artifact@v4
        with:
          name: mealcare-macro-v1.0.3-apk
          path: mealcare-macro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
