name: MealCare Macro APK
on:
  push:
    branches: [mealcare-macro-v1]
    paths: ['mealcare-macro/**', '.github/workflows/mealcare-macro-build.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Regression test recorded screen labels
        working-directory: mealcare-macro
        run: |
          mkdir -p /tmp/mealcare-test
          javac -encoding UTF-8 -d /tmp/mealcare-test app/src/main/java/kr/signal/mealcaremacro/PickupParser.java app/src/main/java/kr/signal/mealcaremacro/MealSelection.java tests/PickupParserTest.java
          java -cp /tmp/mealcare-test kr.signal.mealcaremacro.PickupParserTest
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: mealcare-macro
      - uses: actions/upload-artifact@v4
        with:
          name: mealcare-macro-v1.1.0-apk
          path: mealcare-macro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
