name: Build ReelReply APK
on:
  push:
    branches: [feature/reels-comment-assistant]
    paths:
      - 'reels-assistant/**'
      - '.github/workflows/reels-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon -p reels-assistant assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReelReply-v1-debug-apk
          path: reels-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
